# configs/gpt_50m.yaml -- 1x A100 40GB, ~4-8h
data_dir: data/tokens
train_bin: train.bin
val_bin:   val.bin

# model (50.9M params)
n_layer:    8
n_head:     8
n_embd:     512
block_size: 1024
vocab_size: 50257
dropout:    0.0

# training
batch_size:       16        # per-device. With grad_accum=4 -> effective 64 seqs = 65,536 tok/step
grad_accum_steps: 4
max_steps:        5000      # 5000 x 65,536 = 328M tokens seen
warmup_steps:     100
lr:               3.0e-4
min_lr:           3.0e-5
beta1:            0.9
beta2:            0.95
weight_decay:     0.1
grad_clip:        1.0
spike_skip_norm:  5.0       # Day 5: skip the optimizer step if pre-clip grad norm > this (after warmup). null = off

# logging / checkpoints
eval_interval:       250
eval_iters:          50
save_interval:       500
log_interval:        10
keep_last_ckpts:     3       # prune older ckpt_step_*.pt (each is ~600MB with optimizer state)
hf_upload_interval:  1000    # mirror to HF Hub every N steps (needs --hf_repo). 0 = only at the end
ckpt_dir:            checkpoints

# system
dtype:   bfloat16   # float16 on T4 / V100 (no bf16)
compile: true       # torch.compile -> ~+30% on A100
seed:    1337
