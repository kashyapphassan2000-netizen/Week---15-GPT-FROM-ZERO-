# configs/tiny_cpu.yaml -- laptop smoke test of the full pipeline. NOT a real run.
base: configs/gpt_50m.yaml
n_layer:    2
n_head:     4
n_embd:     128
block_size: 128
batch_size:       4
grad_accum_steps: 2
max_steps:        60
warmup_steps:     10
lr:               1.0e-3
